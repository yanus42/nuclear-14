- type: entity
  parent: N14TableDeskSchool
  id: N14NewspaperDesk
  name: newspaper desk
  description: Compose a bulletin and print copies of the approved edition.
  components:
  - type: NewspaperDesk
  - type: MaterialStorage
    whitelist:
      components:
      - Paper
      - Stack
      tags:
      - Sheet
    materialWhiteList:
    - Paper
  - type: ActivatableUI
    key: enum.NewspaperDeskUiKey.Key
  - type: UserInterface
    interfaces:
      enum.NewspaperDeskUiKey.Key:
        type: NewspaperDeskBoundUserInterface

- type: entity
  parent: BaseItem
  id: N14PrintedBulletin
  name: printed bulletin
  description: A small printed news sheet.
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Misc/magazines.rsi
    state: magazine_base
  - type: NewspaperCopy
  - type: PaperSurface
    appearance:
      profile: N14WornNewsprint
      wear: 0.65
  - type: Item
    size: Tiny
  - type: Tag
    tags:
    - Document
    - Paper
  - type: ActivatableUI
    key: enum.NewspaperCopyUiKey.Key
    requiresComplex: false
  - type: UserInterface
    interfaces:
      enum.NewspaperCopyUiKey.Key:
        type: NewspaperCopyBoundUserInterface
